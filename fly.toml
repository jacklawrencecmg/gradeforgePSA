# Fly.io configuration for GradeForge
app = "gradeforgepsa"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  GRADEFORGE_PAYWALL = "1"
  GRADEFORGE_TRUST_PROXY = "1"
  GRADEFORGE_DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "gradeforge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
