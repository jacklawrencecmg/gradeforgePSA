# Fly.io configuration for GradeForge
app = "gradeforgepsa"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  GRADEFORGE_PAYWALL = "1"
  GRADEFORGE_TRUST_PROXY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
